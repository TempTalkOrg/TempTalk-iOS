name: PR Notification

on:
  pull_request:
    types: [opened, reopened]

jobs:
  notify:
    runs-on: self-hosted
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # No extraction step needed here anymore, kscript handles it

      - name: Send notification via kscript
        env:
          # GITHUB_PASSWORD_DIFFT is expected to be available globally on the CI runner
          # and will be picked up by prNotify.kts via System.getenv()
          
          # Initial PR details from GitHub context, prefixed with ENV_
          ENV_PR_URL: ${{ github.event.pull_request.html_url }}
          ENV_PR_CREATOR: ${{ github.event.pull_request.user.login }}
          ENV_PR_NUMBER: ${{ github.event.pull_request.number }}
          # ENV_PR_TITLE and ENV_PR_BODY are now fetched by the kscript after the delay
          
          # For enabling debug logging in kscript
          RUNNER_DEBUG: ${{ runner.debug }}
        run: |
          echo "Running prNotify.kts script..."
          echo "Environment variables for kscript:"
          echo "  ENV_PR_URL: $ENV_PR_URL"
          echo "  ENV_PR_CREATOR: $ENV_PR_CREATOR"
          echo "  ENV_PR_NUMBER: $ENV_PR_NUMBER"
          echo "  RUNNER_DEBUG: $RUNNER_DEBUG"
          # GITHUB_PASSWORD_DIFFT is sensitive, so not echoing its value
          
          kscript fastlane/.prNotify.kts