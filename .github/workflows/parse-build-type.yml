name: Parse Build Type

on:
  workflow_call:
    inputs:
      comment_body:
        required: true
        type: string
        description: 'GitHub comment body to parse'
      command_prefix:
        required: true
        type: string
        description: 'Command prefix to match (e.g., /cc_tf, /wea_tf)'
    outputs:
      build_type:
        description: 'Parsed build type (beta or online)'
        value: ${{ jobs.parse.outputs.build_type }}

jobs:
  parse:
    runs-on: self-hosted
    # Skip the entire job if the command prefix doesn't match
    if: contains(inputs.comment_body, inputs.command_prefix)
    outputs:
      build_type: ${{ steps.parse-build-type.outputs.build_type }}
    steps:
      - name: Parse Build Type
        id: parse-build-type
        run: |
          # 解析评论内容，提取BUILD_TYPE参数
          COMMENT_BODY="${{ inputs.comment_body }}"
          COMMAND_PREFIX="${{ inputs.command_prefix }}"
          echo "✅ Processing comment with matched prefix: $COMMAND_PREFIX"
          echo "Comment: $COMMENT_BODY"
          
          # 检查是否包含 'online' 参数，默认为 'beta'
          if echo "$COMMENT_BODY" | grep -q "${COMMAND_PREFIX} online"; then
            BUILD_TYPE="online"
          else
            BUILD_TYPE="beta"
          fi
          
          echo "BUILD_TYPE=$BUILD_TYPE" >> $GITHUB_OUTPUT
          echo "✅ BUILD_TYPE 设置为: $BUILD_TYPE"
