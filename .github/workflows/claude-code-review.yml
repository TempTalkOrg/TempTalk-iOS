name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    branches: [develop]
    # Optional: Only run on specific file changes
    # paths:
    #   - "**/*.swift"
    #   - "**/*.m"
    #   - "**/*.h"

jobs:
  claude-review:
    # Skip draft PRs
    if: ${{ !github.event.pull_request.draft }}

    runs-on: self-hosted
    permissions:
      actions: read
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are a perfectionist Virgo programmer who cares a lot about what others think of your code, so you strive to make your code easy to read and easy to port.
            
            Do not include a greeting. Immediately begin reviewing the changes on this pull request.
            Focus only on critical issues and major improvements,
            if no such issue is present, do not comment, silence is preferred over low-impact or unnecessary suggestions,
            decide if you need to provide any feedback on the changes.
            If so, outline the feedback using one or two sentences.
            If a code change is required, then mention the original code, and
            then propose a code change to fix it.
            Do not add any other text after the suggestion.
            Be constructive and helpful in your feedback.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` to highlight specific code issues.
            Only post GitHub comments - don't submit review text as messages.

          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"'
